<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examentracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <div id="home">
        <h1>Examentracker</h1>
        <p>Version: <span id="version">Laden...</span></p>
        <p>Welkom bij de Examentracker! Hier kun je al je examens bijhouden en plannen.</p>
        <div id="total">Totale voortgang: 0%</div>
        <div id="subjects">
            <h2>Vakken</h2>
            <ul id="subject-list">
                <!-- Hier worden de vakken dynamisch toegevoegd -->
            </ul>
        </div>
    </div>
    <hr>
    <div id="subject-detail" style="display:none;">
        <h2 id="subject-name">Vaknaam</h2>
        <p>Hier kun je de voortgang van dit vak bijhouden.</p>
        <p>SE-cijfer:</p>
        <input type="number" id="se-grade" min="1" max="10" step="0.1">
        <p>Streefcijfer:</p>
        <h3 id="target-grade">8.0</h3>
        <p>Examens:</p>
        <form id="exam-form">
            <select id="exam-name" required>
                <option value="" disabled selected>Kies een examen...</option>
                <option value="2021-I">2021-I</option>
                <option value="2021-II">2021-II</option>
                <option value="2022-I">2022-I</option>
                <option value="2022-II">2022-II</option>
                <option value="2023-I">2023-I</option>
                <option value="2023-II">2023-II</option>
                <option value="2024-I">2024-I</option>
                <option value="2024-II">2024-II</option>
                <option value="2025-I">2025-I</option>
                <option value="2025-II">2025-II</option>
            </select>
            <input type="number" id="exam-grade" placeholder="Cijfer" min="1" max="10" step="0.1" required>
            <input type="date" id="exam-date" required>
            <button type="submit">Examen toevoegen</button>
        </form>
        <ul id="exam-list">
            <!-- Hier worden de examens dynamisch toegevoegd -->
        </ul>
    </div>
    <script src="main.js"></script>
</body>
</html>
